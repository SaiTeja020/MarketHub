version: "3.8"

services:
  # -----------------------------------------
  # Redis (Cache)
  # -----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # -----------------------------------------
  # RabbitMQ (Broker for Node scraper ONLY)
  # -----------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  # -----------------------------------------
  # Elasticsearch
  # -----------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch_server
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: always

  # -----------------------------------------
  # Kibana
  # -----------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: kibana_ui
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: always

  # -----------------------------------------
  # Logstash
  # -----------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.14.0
    container_name: logstash_server
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    restart: always

  # -----------------------------------------
  # Prometheus
  # -----------------------------------------
  prometheus:
    image: prom/prometheus
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  # -----------------------------------------
  # Grafana
  # -----------------------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana_server
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

  # -----------------------------------------
  # FastAPI — ONLY router + analysis coordinator
  # -----------------------------------------
  fastapi:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - rabbitmq
      - elasticsearch
      - node_api
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres.sfdzwhjgegdtlndsepxs:MarketHubPS853@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require
      
      # Microservices
      - NODE_SCRAPER_URL=http://node_api:5000

      # Infrastructure
      - REDIS_URL=redis://redis:6379/0
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
      - ELASTIC_URL=http://elasticsearch:9200
    restart: always

  # -----------------------------------------
  # Celery Worker — ONLY analysis (Gemini)
  # -----------------------------------------
  celery_worker:
    build:
      context: ./backend/python
      dockerfile: Dockerfile.worker
    container_name: celery_worker
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
    restart: always

  # -----------------------------------------
  # Node.js Scraper (Playwright + RabbitMQ + Redis)
  # -----------------------------------------
  node_api:
    build: ./backend/node
    container_name: node_app
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - rabbitmq
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres.sfdzwhjgegdtlndsepxs:MarketHubPS853@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require
      
      # Infrastructure
      - REDIS_URL=redis://redis:6379/0
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
      - ELASTIC_URL=http://elasticsearch:9200
    restart: always

# -----------------------------------------
# Persistent Volumes
# -----------------------------------------
volumes:
  redis_data:
  rabbitmq_data:
  es_data:
  grafana_data:
