version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch_server
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      retries: 5
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g

  node_api:
    build: ./backend/node
    container_name: node_app
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 2s
      retries: 5
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
      - ELASTIC_URL=http://elasticsearch:9200
      - DATABASE_URL=postgresql://postgres.sfdzwhjgegdtlndsepxs:MarketHubPS853@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require
    restart: always

  fastapi:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      node_api:
        condition: service_healthy
    # Use a python-based healthcheck to avoid curl/wget portability issues
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          python -c 'import sys,urllib.request
          resp=urllib.request.urlopen("http://127.0.0.1:8000/")
          sys.exit(0 if resp.getcode()==200 else 1)'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
      - ELASTIC_URL=http://elasticsearch:9200
      - NODE_SCRAPER_URL=http://node_app:4000
      - DATABASE_URL=postgresql://postgres.sfdzwhjgegdtlndsepxs:MarketHubPS853@aws-1-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require
    restart: always
    volumes:
      - ./backend/python:/app

  scraper:
    build:
      context: ./backend/node
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: 1g
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
    volumes:
      - scraper-playwright-browsers:/ms-playwright
    depends_on:
      - rabbitmq
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper_worker:
    build:
      context: ./backend/node
      dockerfile: Dockerfile
    container_name: markethub-scraper-worker
    command: ["node", "dist/scraper/consumer.js"]
    environment:
      - NODE_ENV=production
      - RABBIT_URL=amqp://admin:admin@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    shm_size: 1g

  # --- Gemini async worker (Celery) --------------------------
  celery_worker:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: celery_worker
    command: >
      celery -A utils.celery_app worker
      --loglevel=info
      --concurrency=2
      -Q gemini,default
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://admin:admin@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=AIzaSyAHdOkX9a08v0DYJx2vyGpf_jS25zE_pdw
      - GEMINI_ENDPOINT=https://generativelanguage.googleapis.com
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - ./backend/python:/app

  celery_beat:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: celery_beat
    command: celery -A utils.celery_app beat --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=amqp://admin:admin@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=rpc://
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - ./backend/python:/app

volumes:
  redis_data:
  rabbitmq_data:
  es_data:
  scraper-playwright-browsers:
